<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #525252;
      overflow: hidden;
    }
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.5rem;
      background: #121212;
      border-bottom: 2px solid #000;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: #fff;
      height: 2.5rem;
    }
    #toolbar[hidden] { display: none; }
    #toolbar button {
      font: inherit;
      font-weight: 700;
      padding: 0.25rem 0.625rem;
      border: 2px solid #000;
      background: #fff;
      cursor: pointer;
    }
    #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #page-info { min-width: 5rem; text-align: center; }
    #viewport {
      height: calc(100% - 2.5rem);
      overflow: auto;
      padding: 1rem;
      text-align: center;
    }
    #viewport.full {
      height: 100%;
      padding: 0;
    }
    #canvas {
      max-width: 100%;
      height: auto;
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      background: #fff;
    }
    #pdf-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    /* ID rules beat the UA [hidden] style — force real hide so no blank scroll page */
    #status[hidden],
    #canvas[hidden],
    #pdf-frame[hidden],
    #toolbar[hidden] {
      display: none !important;
    }
    #status {
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.875rem;
      padding: 2rem;
      line-height: 1.6;
    }
    #status a { color: #FBFF48; }
  </style>
</head>
<body>
  <div id="toolbar" hidden>
    <button type="button" id="prev-btn" aria-label="Previous page">PREV</button>
    <span id="page-info">-- / --</span>
    <button type="button" id="next-btn" aria-label="Next page">NEXT</button>
  </div>
  <div id="viewport">
    <p id="status">LOADING CV...</p>
    <canvas id="canvas" hidden></canvas>
    <iframe id="pdf-frame" title="Resume PDF" hidden></iframe>
  </div>
  <script src="/Assets/js/vendor/pdf.min.js"></script>
  <script>
    (function () {
      'use strict';

      var DEFAULT_PDF = '/Assets/Resume/Yuvraj%20Prasad%20CV.pdf';
      var params = new URLSearchParams(window.location.search);

      function notifyParent(state) {
        if (window.parent === window) return;
        try {
          window.parent.postMessage({ type: 'yp-cv-preview', ...state }, window.location.origin);
        } catch (_) { /* ignore */ }
      }

      function resolvePdfUrl(raw) {
        var candidate = raw || DEFAULT_PDF;
        var url;
        try {
          url = new URL(candidate, window.location.origin);
        } catch (_) {
          return new URL(DEFAULT_PDF, window.location.origin).href;
        }

        if (url.protocol !== 'http:' && url.protocol !== 'https:' && url.protocol !== 'file:') {
          return new URL(DEFAULT_PDF, window.location.origin).href;
        }

        // Keep same-origin only when not file://
        if (url.protocol !== 'file:' && url.origin !== window.location.origin) {
          return new URL(DEFAULT_PDF, window.location.origin).href;
        }

        var path = decodeURIComponent(url.pathname).replace(/\\/g, '/').toLowerCase();
        if (path.indexOf('/assets/resume/') === -1 && path.indexOf('/resume/') === -1) {
          return new URL(DEFAULT_PDF, window.location.origin).href;
        }
        if (!path.endsWith('.pdf')) {
          return new URL(DEFAULT_PDF, window.location.origin).href;
        }
        return url.href;
      }

      var pdfUrl = resolvePdfUrl(params.get('src'));
      var canvas = document.getElementById('canvas');
      var frame = document.getElementById('pdf-frame');
      var statusEl = document.getElementById('status');
      var toolbar = document.getElementById('toolbar');
      var viewport = document.getElementById('viewport');
      var pageInfo = document.getElementById('page-info');
      var prevBtn = document.getElementById('prev-btn');
      var nextBtn = document.getElementById('next-btn');
      var ctx = canvas.getContext('2d', { alpha: false });
      var pdfDoc = null;
      var pageNum = 1;

      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/Assets/js/vendor/pdf.worker.min.js';
      }

      function showError(message) {
        statusEl.hidden = false;
        statusEl.innerHTML = message + '<br><a href="' + pdfUrl + '" target="_blank" rel="noopener">Open / Download CV</a>';
        toolbar.hidden = true;
        canvas.hidden = true;
        frame.hidden = true;
        viewport.classList.remove('full');
        notifyParent({ ready: false, mode: 'error' });
      }

      function showIframeFallback() {
        statusEl.hidden = true;
        toolbar.hidden = true;
        canvas.hidden = true;
        viewport.classList.add('full');
        frame.hidden = false;
        frame.src = pdfUrl + '#view=FitH&toolbar=1&navpanes=0';
        notifyParent({ ready: true, mode: 'iframe' });
      }

      function canvasLooksEmpty() {
        try {
          var sample = ctx.getImageData(0, 0, Math.min(canvas.width, 40), Math.min(canvas.height, 40)).data;
          for (var i = 0; i < sample.length; i += 16) {
            if (sample[i] < 248 || sample[i + 1] < 248 || sample[i + 2] < 248) return false;
          }
          return true;
        } catch (_) {
          return false;
        }
      }

      function renderPage(num) {
        return pdfDoc.getPage(num).then(function (page) {
          var base = page.getViewport({ scale: 1 });
          var targetWidth = Math.min(900, Math.max(320, viewport.clientWidth - 32 || 800));
          var scale = targetWidth / base.width;
          var viewportPage = page.getViewport({ scale: scale });
          canvas.width = Math.floor(viewportPage.width);
          canvas.height = Math.floor(viewportPage.height);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return page.render({ canvasContext: ctx, viewport: viewportPage }).promise;
        }).then(function () {
          if (canvasLooksEmpty()) {
            throw new Error('Blank canvas render');
          }
          pageInfo.textContent = num + ' / ' + pdfDoc.numPages;
          prevBtn.disabled = num <= 1;
          nextBtn.disabled = num >= pdfDoc.numPages;
          statusEl.hidden = true;
          toolbar.hidden = false;
          canvas.hidden = false;
          frame.hidden = true;
          viewport.classList.remove('full');
          notifyParent({ ready: true, mode: 'canvas' });
        });
      }

      prevBtn.addEventListener('click', function () {
        if (pageNum <= 1) return;
        pageNum -= 1;
        renderPage(pageNum).catch(showIframeFallback);
      });

      nextBtn.addEventListener('click', function () {
        if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
        pageNum += 1;
        renderPage(pageNum).catch(showIframeFallback);
      });

      function loadWithPdfJs(buffer) {
        if (typeof pdfjsLib === 'undefined') {
          return Promise.reject(new Error('PDF.js missing'));
        }
        var source = buffer
          ? { data: new Uint8Array(buffer), disableStream: true, disableAutoFetch: true, isEvalSupported: false }
          : { url: pdfUrl, disableStream: true, disableAutoFetch: true, isEvalSupported: false };

        return pdfjsLib.getDocument(source).promise.then(function (pdf) {
          pdfDoc = pdf;
          return renderPage(pageNum);
        });
      }

      function boot() {
        fetch(pdfUrl, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            var type = (response.headers.get('content-type') || '').toLowerCase();
            if (type && type.indexOf('pdf') === -1 && type.indexOf('octet-stream') === -1) {
              throw new Error('Unexpected content-type: ' + type);
            }
            return response.arrayBuffer();
          })
          .then(function (buffer) {
            if (!buffer || buffer.byteLength < 5) throw new Error('Empty PDF');
            var header = String.fromCharCode.apply(null, new Uint8Array(buffer.slice(0, 5)));
            if (header !== '%PDF-') throw new Error('Not a PDF');
            return loadWithPdfJs(buffer);
          })
          .catch(function () {
            return loadWithPdfJs(null);
          })
          .catch(function () {
            showIframeFallback();
          });
      }

      if (!pdfUrl) {
        showError('Invalid CV preview source.');
        return;
      }

      boot();
    })();
  </script>
</body>
</html>
